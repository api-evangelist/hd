name: HD
description: >-
  HD is an AI-native healthcare marketplace and patient-navigation platform for
  emerging Southeast Asia, headquartered in Bangkok, Thailand. Its consumer
  surface, HDmall, is a health, dental, aesthetics, and surgery marketplace that
  lets patients compare transparent pricing and book online across 30,000+
  services from 3,000+ clinics and hospitals in Thailand (hdmall.co.th) and
  Indonesia (hdmall.id). AI-powered navigation turns patient symptoms into
  personalized, safety-checked care recommendations, and HDcare adds human-led,
  AI-assisted concierge support for complex surgical cases. The platform has
  navigated over 500,000 patients. HD is a consumer-facing healthtech operator
  with no public developer API or portal; the strongest machine-readable surface
  it publishes today is an llms.txt guiding LLMs to its canonical content. HD is
  a portfolio company of Partech, added to the API Evangelist network for
  enrichment tracking.
